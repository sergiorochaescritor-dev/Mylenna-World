<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Mundo da Mylenna</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Arial', sans-serif;
  background: #fff;
  color: #222;
  overflow-x: hidden;
}

/* ===== ABERTURA ===== */
.hero {
  height: 100vh;
  background: linear-gradient(135deg, #f6c1e1, #d7b5f8, #fbe7f3);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  position: relative;
  overflow: hidden;
}

.hero::before {
  content: "";
  position: absolute;
  width: 300px;
  height: 300px;
  border: 4px solid #000;
  border-radius: 50%;
  opacity: 0.1;
  animation: spin 20s linear infinite;
}

.logo {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
  animation: fadeDown 2s ease;
}

.star {
  width: 50px;
  height: 50px;
  border: 3px solid #000;
  clip-path: polygon(
    50% 0%,
    61% 35%,
    98% 35%,
    68% 57%,
    79% 91%,
    50% 70%,
    21% 91%,
    32% 57%,
    2% 35%,
    39% 35%
  );
}

.logo h1 {
  font-size: 2.8rem;
  letter-spacing: 2px;
}

.hero p {
  font-size: 1.3rem;
  margin-top: 10px;
  animation: floatText 3s ease-in-out infinite;
}

/* ===== MENU ===== */
nav {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 10;
}

nav a {
  text-decoration: none;
  margin-left: 15px;
  font-weight: bold;
  color: #000;
}

/* ===== SEÇÕES ===== */
section {
  padding: 70px 20px;
  text-align: center;
}

.card {
  max-width: 850px;
  margin: auto;
  background: #fff;
  border-radius: 25px;
  padding: 40px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.08);
  margin-bottom: 50px;
  animation: fadeUp 1.5s ease;
}

.card h2 {
  font-size: 2rem;
  margin-bottom: 20px;
}

.card p {
  font-size: 1.1rem;
  line-height: 1.6;
}

/* ===== RODAPÉ ===== */
footer {
  background: #f6c1e1;
  padding: 25px;
  text-align: center;
  font-size: 0.9rem;
}

/* ===== ANIMAÇÕES ===== */
@keyframes spin {
  from {transform: rotate(0deg);}
  to {transform: rotate(360deg);}
}

@keyframes fadeDown {
  from {opacity: 0; transform: translateY(-30px);}
  to {opacity: 1; transform: translateY(0);}
}
